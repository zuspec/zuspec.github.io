name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
    build-and-deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            submodules: false  # Don't use submodules, use ivpm instead
            
        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            
        - name: Install System Dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended
            
        - name: Install Python Dependencies
          run: |
            python3 -m pip install --upgrade pip
            python3 -m pip install uv
            python3 -m pip install -r docs/requirements.txt
            
        - name: Fetch Package Dependencies with IVPM
          run: |
            uvx ivpm update -a
            
        - name: Build Documentation and Generate llms.txt
          run: |
            make
            
        - name: Verify llms.txt was generated
          run: |
            if [ ! -f web/llms.txt ]; then
              echo "Error: llms.txt was not generated in web/"
              exit 1
            fi
            echo "✓ llms.txt generated successfully"
            echo "Size: $(wc -c < web/llms.txt) bytes"

        - name: Deploy to GitHub Pages
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            branch: gh-pages
            folder: web
            clean: true

