name: Build and Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
    build-and-deploy:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4
          with:
            submodules: false  # Don't use submodules, use ivpm instead
            
        - name: Setup Python
          uses: actions/setup-python@v5
          with:
            python-version: '3.11'
            
        - name: Install System Dependencies
          run: |
            sudo apt-get update
            sudo apt-get install -y pandoc texlive-latex-base texlive-latex-recommended
            
        - name: Install UV and Fetch Package Dependencies with IVPM
          run: |
            python3 -m pip install --upgrade pip
            python3 -m pip install uv
            uvx ivpm update -a
            
        - name: Build Documentation and Generate llms.txt
          run: |
            # Use Python from ivpm environment which has Sphinx installed
            export PATH=$PWD/packages/python/bin:$PATH
            make
            
        - name: Deploy to GitHub Pages
          uses: JamesIves/github-pages-deploy-action@v4
          with:
            branch: gh-pages
            folder: docs/_build/html
            clean: true

