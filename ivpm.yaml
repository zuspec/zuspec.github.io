package:
    name: vte
    version: 0.0.1

    dep-sets:
    - name: default
      deps:
      - name: jinja2
        type: python
        src: pypi
      - name: pyyaml
        src: pypi
    - name: default-dev
      deps:
      - name: zuspec
        url: https://github.com/zuspec/zuspec.git
      - name: jinja2
        type: python
        src: pypi
      - name: pyyaml
        src: pypi
      - name: sphinx
        src: pypi
      - name: sphinx-external-toc
        src: pypi
      - name: sphinx-argparse
        src: pypi
      - name: sphinx-jsonschema
        src: pypi
      - name: sphinxcontrib-mermaid
        src: pypi

